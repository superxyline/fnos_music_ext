; 小爱音箱接管（fnmusic-xiaomusic 桥接）：内嵌 xiaomusic + 飞牛音乐桥接，
; 独立开关 FNMUSIC_XIAOMUSIC_ENABLED（与音源三选一无关，可任意叠加）。
[program:xiaomusic]
