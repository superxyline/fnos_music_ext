; fnmusic-sources 容器进程表：全部 autostart=false，
; 由 entrypoint.sh 按 /repo/.env 的启用开关 supervisorctl start（按需加载）。
; 运行期切源 = supervisorctl stop/start（WebUI 同容器内调用），无需 docker.sock。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:musicdl]
directory=/srv/musicdl-service
command=uvicorn app:app --host 0.0.0.0 --port 8001
; 搜索预算（2026-10-22 实测调整）：musicdl 搜索要为每首歌逐个解析直链
; （官方接口多档 + 第三方镜像 + 逐条探活），出口网络一慢就成倍放大——
; 默认 8s 单源/12s 总体会把所有源判超时、结果 0 条。放宽到 25s/32s，
; 同时把每源抓取首数降到 6（少解析几首）+ fast_return 6 条（凑够即返回，
; 快网下仍是一两秒出结果）。request_timeout 3s 让死镜像快速失败。
environment=MUSICDL_REQUEST_TIMEOUT="3",MUSICDL_SEARCH_PAGE_CAP="6",MUSICDL_ADAPTIVE_MIN_TIMEOUT="25",MUSICDL_SEARCH_TIMEOUT="32",MUSICDL_FAST_RETURN_ITEMS="6",MUSICDL_SLOW_GRACE_S="3"
autostart=false
autorestart=true
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:musicbox]
directory=/srv/musicbox-service
command=uvicorn app:app --host 0.0.0.0 --port 8002
autostart=false
autorestart=true
startretries=5
